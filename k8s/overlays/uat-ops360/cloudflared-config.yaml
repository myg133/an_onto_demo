# cloudflared 的配置（**本地管理隧道**）
#
# 为什么用本地管理而不是 token：只有本地 config 才能写 **ingress 路径规则**，
# 也才能把 /metrics 直接挡在隧道层（CF 绕过 traefik，ingress 挡不住它）。
#
# 要填三个值（见 sidecar.md）：
#   <TUNNEL_ID>        Cloudflare 里那条隧道的 id
#   <PUBLIC_HOST>      对外域名（必须是**托管在 Cloudflare 上**的域名）
#
# ⚠️ <PUBLIC_HOST> 现在填的是占位；部署前必须替换。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: anspire-ontok-uat
data:
  config.yaml: |
    tunnel: <TUNNEL_ID>
    credentials-file: /etc/cloudflared/creds/credentials.json
    no-autoupdate: true
    metrics: 127.0.0.1:2001

    # ⛔ 顺序有意义：先挡 /metrics，再放行其余
    ingress:
      - hostname: <PUBLIC_HOST>
        path: ^/metrics$
        service: http_status:404
      - hostname: <PUBLIC_HOST>
        service: http://127.0.0.1:8800
      - service: http_status:404
