apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ops360 本体服务（合作方接入用）
#
# 与 uat 的差别：**只部署 query**，且用 `--ontology-only`：
#   · 无业务库（Ops360 没有数据库）⇒ 不需要 --schema / --policy / 源库连接
#   · catalog / describe / ontology.ttl 直接读快照
#   · SPARQL ⇒ 503 NO_DATA_SOURCE（REST）/ 200+isError（MCP）
#
# 为什么不用 console：合作方只要本体接口，多开一个面就多一份暴露。
namespace: anspire-ontok-uat

resources:
  - ../../base
  - ingress.yaml

images:
  - name: ontok
    newName: aigccontainer.azurecr.cn/an_onto/ontok
    newTag: 0.3.1

replicas:
  - { name: ontok-query, count: 1 }

patches:
  # ① 删掉 console（只留 query）
  - target: { kind: Deployment, name: ontok-console }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ontok-console }
  - target: { kind: Service, name: ontok-console }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: ontok-console }

  # ② 本体模式的启动参数：去掉 --schema / --policy（R1 互斥），加 --ontology-only
  - target: { kind: Deployment, name: ontok-query }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - query
          - serve
          - --bind=0.0.0.0:8800
          - --allow-public
          - --tokens=/etc/ontok/secrets/query-tokens.json
          - --project=$(ONTOK_PROJECT)
          - --version=$(ONTOK_VERSION)
          - --access-mapping=/etc/ontok/am/am-tencent.json
          - --ontology-only
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "cloud-resource"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "5"
      # 本体模式不读源库：把这个 env 去掉，避免"看起来需要它"
      - op: remove
        path: /spec/template/spec/containers/0/env/3
  # ③ ConfigMap / Secret 由部署流程**单独 provision**（含真 token），
  #    ⛔ 不能交给 base 的空占位版本 —— 否则 apply 会把合作方 token 抹成空列表。
  - target: { kind: ConfigMap, name: ontok-config }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: ontok-config }
  - target: { kind: Secret, name: ontok-secrets }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata: { name: ontok-secrets }
  - target: { kind: Secret, name: ontok-db }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata: { name: ontok-db }
  # ④ 从 ACR 拉镜像需要凭据（命名空间里的 postgres17-wal-registry 已复制过来）
  - target: { kind: Deployment, name: ontok-query }
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: postgres17-wal-registry

  # ④''' 同 tag 重建后必须重拉：`IfNotPresent` 会继续用节点上缓存的老镜像，
  #        ⇒ 改成 `Always`（我们发版习惯是"同版本号覆盖重建"，tag 可变就必须 Always）
  - target: { kind: Deployment, name: ontok-query }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ④'' 写面密钥：`query serve` 从 REQ-159 P1c-1 起承载写面（Studio 建项目/传包/配 DSN），
  #     必须用 ONTOK_SECRET_KEY 加密 DSN 与 query key；缺了**拒绝启动**（不是降级）。
  #     ⚠️ Secret `ontok-write` 由部署流程单独 provision（含真密钥），⛔ 不进版本库。
  - target: { kind: Deployment, name: ontok-query }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ONTOK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ontok-write
              key: secret-key

  # ④' AM 挂载：ConfigMap → /etc/ontok/am（readOnly）
  - target: { kind: Deployment, name: ontok-query }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: am
          configMap:
            name: ontok-access-mapping
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: am
          mountPath: /etc/ontok/am
          readOnly: true

  # ⑤ CF Tunnel sidecar（**token 模式**，已启用）
  #    链路：公网 → Cloudflare → cloudflared(本 Pod) → 127.0.0.1:8800
  #    ⚠️ 不过 traefik ⇒ 与内网 ingress 是两条独立入口
  #    ⚠️ token 模式是**远程管理隧道**：集群里的 config.yaml 会被忽略，
  #       /metrics 的拦截必须在 Cloudflare 面板加 WAF 规则（见 sidecar.md §五）
  #    前提：Secret cloudflared-token（已建）
  - path: sidecar-patch.yaml
    target: { kind: Deployment, name: ontok-query }

# AM（access mapping）：14 个类的取数契约（contract_version 2，含 operation.headers 与
# request.defaults）。**不含凭据**（只有环境变量名）。
# 改它之后要重新 apply；`query serve --access-mapping` 会 bind 到本体，class 不在本体里就拒绝启动。
configMapGenerator:
  - name: ontok-access-mapping
    files:
      - am-tencent.json
