apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 生产：多副本、固定镜像 tag（⛔ 不用 latest）、资源与探针更严
namespace: ontok

resources:
  - ../../base

images:
  - name: ontok
    newName: registry.example.com/ontok
    newTag: 0.1.0

replicas:
  - { name: ontok-query,   count: 3 }
  - { name: ontok-console, count: 1 }
  - { name: ontok-portal,  count: 2 }

patches:
  - target: { kind: Deployment, name: ontok-query }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi

  # ⚠️ 这里**故意没有** prometheus.io/scrape 注解 —— 产品当前**没有 /metrics 端点**。
  #    曾经加过，是假的（抓不到任何东西，只会让面板显示"0 指标"而让人以为在监控）。
  #    要开监控，先实现 /metrics（见 Deploy/PRODUCTION-READINESS.md §3），再加注解。

