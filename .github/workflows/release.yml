name: release

# 只在两种情况下跑：
#   1. 手动触发（第一次发布 npm 必须手动 —— 那时 token/包都还不存在）
#   2. 打 tag（v0.3.1 这种），且 publish=true
#
# ⛔ 只构建 ontok-builder（用户口径：服务端二进制不在这个流水线里）
# ⛔ 平台只发三个：win32-x64 · darwin-arm64 · linux-x64（linux 不要 arm，mac 不要 x64）

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "真的发布到 npm（需要仓库 secret NPM_TOKEN；不勾就只构建并上传 artifact）"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ontok-builder.exe
          - slug: darwin-arm64
            os: macos-14 # arm64 runner
            target: aarch64-apple-darwin
            bin: ontok-builder
          - slug: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ontok-builder

    steps:
      - uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ⚠️ --locked：Cargo.lock 必须与 Cargo.toml 一致（2026-10-27 就因为发版只改了
      #    Cargo.toml 没改 lock，导致 --locked 构建直接失败过一次）
      - name: cargo build（只 ontok-builder）
        run: cargo build --release --locked --bin ontok-builder --target ${{ matrix.target }}

      - name: 生成平台包
        shell: bash
        run: |
          node npm/prepare.mjs platform \
            --slug "${{ matrix.slug }}" \
            --bin "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: 上传平台包（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.slug }}
          path: npm/out
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    # 手动触发要看勾没勾；tag 触发一律发
    if: github.event_name == 'push' || inputs.publish == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: 下载三个平台包
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm/out
          merge-multiple: true

      - name: 生成主包（版本取自 Cargo.toml）
        run: node npm/prepare.mjs main

      - name: 核对版本一致（包 == Cargo.toml == tag）
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./npm/out/@anspire-ai/ontok-builder/package.json').version")
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "npm=$ver cargo=$cargo_ver ref=${GITHUB_REF_NAME}"
          [ "$ver" = "$cargo_ver" ] || { echo "版本不一致：npm=$ver cargo=$cargo_ver"; exit 1; }
          case "${GITHUB_REF_NAME}" in
            v*) [ "v$ver" = "${GITHUB_REF_NAME}" ] || { echo "tag 与版本不一致"; exit 1; } ;;
          esac

      # ⚠️ token 必须是 **Automation** 类型（Classic → Automation）。
      #    `Publish` 类型每次都要 OTP ⇒ CI 里必然 EOTP（2026-10-28 实测踩过一次）。
      - name: preflight · token 与 registry
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::缺 secret NPM_TOKEN（Settings → Secrets and variables → Actions → New repository secret）"
            exit 1
          fi
          if ! who=$(npm whoami 2>&1); then
            echo "$who"
            echo "::error::npm whoami 失败 —— token 无效或已过期"
            exit 1
          fi
          echo "npm 身份：$who"
          npm ping

      - name: publish 平台包（先于主包：主包靠 optionalDependencies 找它们）
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for p in npm/out/@anspire-ai/ontok-builder-*; do
            echo "→ $p"
            if ! out=$(npm publish "$p" --access public 2>&1); then
              echo "$out"
              case "$out" in
                *EOTP*)
                  echo "::error::EOTP —— token 类型是 Publish（要 OTP）。请在 npmjs.com → Access Tokens → Generate New Token → Classic → 选 Automation，再更新 secret NPM_TOKEN" ;;
                *E403*)
                  echo "::error::E403 —— 这个 token 对 @anspire-ai 没有发布权（不是 org 成员 / token 权限范围不含该 scope）" ;;
                *E404*)
                  echo "::error::E404 —— scope @anspire-ai 在 npm 上不存在（先在 npm 建 org）" ;;
                *EPUBLISHCONFLICT*|*"cannot publish over"*)
                  echo "::error::版本已存在 —— 升版本号（Cargo.toml + Cargo.lock），不要复用版本号重试" ;;
                *)
                  echo "::error::npm publish 失败（原因见上方 npm 输出）" ;;
              esac
              exit 1
            fi
            echo "$out" | tail -4
          done

      - name: publish 主包
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/out/@anspire-ai/ontok-builder --access public

      - name: 冒烟：从 registry 装回来再跑 --version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./npm/out/@anspire-ai/ontok-builder/package.json').version")
          d=$(mktemp -d)
          cd "$d"
          npm init -y >/dev/null
          npm i "@anspire-ai/ontok-builder@$ver" --include=optional
          npx ontok-builder --version
