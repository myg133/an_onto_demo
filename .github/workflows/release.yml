name: release

# 什么时候跑：
#   1. workflow_dispatch（手动）—— 可勾 publish 决定真发还是空跑
#   2. push tag `v*` —— 一律发
#
# ⛔ 只构建 ontok-builder（用户口径：服务端二进制不进这条流水线）
# ⛔ 平台只发三个：win32-x64 · darwin-arm64 · linux-x64（linux 不要 arm，mac 不要 x64）
#
# 认证有两条路（见 Deploy/tools/PUBLISH.md）：
#   · OIDC / trusted publishing —— 推荐，无 token、不过期、自动 provenance
#   · NPM_TOKEN（granular token）—— 兜底；账号强制 2FA 且 token 不能绕时可能 EOTP

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "真的发布到 npm（不勾就只构建 + 上传 bundle）"
        type: boolean
        default: false
      auth:
        description: "认证方式。auto = 有 id-token 就走 trusted publishing，否则用 NPM_TOKEN"
        type: choice
        options: [auto, oidc, token]
        default: auto
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # ⭐ trusted publishing 必需：npm 用 GitHub 的 OIDC 换短期凭据（无 token）
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: https://registry.npmjs.org

jobs:
  build:
    name: build ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ontok-builder.exe
          - slug: darwin-arm64
            os: macos-14 # arm64 runner
            target: aarch64-apple-darwin
            bin: ontok-builder
          - slug: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ontok-builder

    steps:
      - uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚠️ --locked：Cargo.lock 必须与 Cargo.toml 一致（2026-10-27 就因为发版只改了
      #    Cargo.toml 没改 lock，导致 --locked 构建直接失败过一次）
      - name: cargo build（只 ontok-builder）
        run: cargo build --release --locked --bin ontok-builder --target ${{ matrix.target }}

      - name: 生成平台包
        shell: bash
        run: |
          node npm/prepare.mjs platform \
            --slug "${{ matrix.slug }}" \
            --bin "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: 上传平台包（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.slug }}
          path: npm/out
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish == true
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 这里**故意不用** setup-node 的 registry-url：
      #    它会往 .npmrc 写 `_authToken=${NODE_AUTH_TOKEN}`，OIDC 模式下那行是空的，
      #    反而让 npm 以为"要用 token 但没给"。registry 下面手动配。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 升级 npm（trusted publishing 需要 npm ≥ 11.5.1）
        shell: bash
        run: |
          set -euo pipefail
          npm i -g npm@latest >/dev/null 2>&1
          echo "npm $(npm --version) · node $(node --version)"

      - name: 下载三个平台包
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm/out
          merge-multiple: true

      - name: 生成主包（版本取自 Cargo.toml）
        run: node npm/prepare.mjs main

      - name: 核对版本一致（包 == Cargo.toml == tag）
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./npm/out/@anspire-ai/ontok-builder/package.json').version")
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "npm=$ver cargo=$cargo_ver ref=${GITHUB_REF_NAME}"
          [ "$ver" = "$cargo_ver" ] || { echo "::error::版本不一致：npm=$ver cargo=$cargo_ver"; exit 1; }
          case "${GITHUB_REF_NAME}" in
            v*) [ "v$ver" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag 与版本不一致"; exit 1; } ;;
          esac

      # 选认证方式并配好 .npmrc；结果写进 $GITHUB_ENV 供后面几步复用
      - name: preflight · 选认证方式 + 配 registry
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          AUTH_INPUT: ${{ inputs.auth }}
        run: |
          set -euo pipefail
          npm config set registry "$REGISTRY"
          want="${AUTH_INPUT:-auto}"
          have_oidc=""
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && have_oidc=1
          have_token=""
          [ -n "${NODE_AUTH_TOKEN:-}" ] && have_token=1

          mode=""
          if [ "$want" = "oidc" ]; then
            [ -n "$have_oidc" ] || { echo "::error::要求 oidc，但工作流没有 id-token: write 权限"; exit 1; }
            mode=oidc
          elif [ "$want" = "token" ]; then
            [ -n "$have_token" ] || { echo "::error::要求 token，但仓库没有 NPM_TOKEN secret"; exit 1; }
            mode=token
          else
            [ -n "$have_oidc" ] && mode=oidc || mode=token
          fi

          if [ "$mode" = "token" ]; then
            [ -n "$have_token" ] || { echo "::error::既没有 OIDC 也没有 NPM_TOKEN"; exit 1; }
            npm config set "//registry.npmjs.org/:_authToken" "$NODE_AUTH_TOKEN"
            if ! who=$(npm whoami 2>&1); then
              echo "$who"
              echo "::error::npm whoami 失败 —— token 无效/过期/类型不对"
              exit 1
            fi
            echo "认证方式：NPM_TOKEN（身份 $who）"
          else
            # 清掉可能存在的空 token 行，确保 npm 走 OIDC
            npm config delete "//registry.npmjs.org/:_authToken" 2>/dev/null || true
            echo "认证方式：trusted publishing（OIDC，无 token）"
            echo "::notice::前提：npm 上这 4 个包都已配置 trusted publisher = GitHub Actions / myg133 / an_onto_demo / release.yml"
          fi
          echo "AUTH_MODE=$mode" >> "$GITHUB_ENV"
          npm ping

      - name: publish 平台包（先于主包：主包靠 optionalDependencies 找它们）
        shell: bash
        run: |
          set -euo pipefail
          echo "模式：${AUTH_MODE}"
          for p in npm/out/@anspire-ai/ontok-builder-*; do
            name=$(node -p "require('./$p/package.json').name")
            ver=$(node -p "require('./$p/package.json').version")
            # 幂等：已发布过的版本就跳过（这样「先 dispatch 发成功、再推 tag 记账」不会红）
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "↷ $name@$ver 已存在，跳过"
              continue
            fi
            echo "→ $p"
            if ! out=$(npm publish "$p" --access public 2>&1); then
              echo "$out"
              case "$out" in
                *EOTP*)
                  echo "::error::EOTP —— token 需要一次性密码。改用 trusted publishing（auth=oidc），或用 granular token（read-write）" ;;
                *"trusted publisher"*|*"not authorized"*|*ENEEDAUTH*)
                  echo "::error::认证失败 —— 若走 OIDC：检查该包是否配了 trusted publisher（仓库 an_onto_demo / 工作流 release.yml / org myg133）" ;;
                *E403*) echo "::error::E403 —— 无发布权（org 成员？scope 权限？）" ;;
                *E404*) echo "::error::E404 —— scope/包不存在" ;;
                *EPUBLISHCONFLICT*|*"cannot publish over"*)
                  echo "::error::该版本已存在 —— 升版本号（Cargo.toml + Cargo.lock），⛔ 不要复用版本号" ;;
                *) echo "::error::npm publish 失败（原因见上方）" ;;
              esac
              exit 1
            fi
            echo "$out" | tail -4
          done

      - name: publish 主包
        shell: bash
        run: |
          set -euo pipefail
          name=$(node -p "require('./npm/out/@anspire-ai/ontok-builder/package.json').name")
          ver=$(node -p "require('./npm/out/@anspire-ai/ontok-builder/package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "↷ $name@$ver 已存在，跳过"
            exit 0
          fi
          if ! out=$(npm publish npm/out/@anspire-ai/ontok-builder --access public 2>&1); then
            echo "$out"
            case "$out" in
              *EOTP*) echo "::error::EOTP —— 改用 trusted publishing 或 granular token" ;;
              *E403*) echo "::error::E403 —— 无发布权" ;;
              *EPUBLISHCONFLICT*|*"cannot publish over"*) echo "::error::该版本已存在 —— 升版本号" ;;
              *) echo "::error::npm publish 失败（原因见上方）" ;;
            esac
            exit 1
          fi
          echo "$out" | tail -4

      # ⚠️ 不能发布完立刻装：npm 的 CDN 有几秒~几分钟的传播延迟，
      #    立刻 npm i 会 ETARGET「无此版本」（2026-10-29 实测，0.3.10 发布其实是成功的）。
      #    先轮询等到版本可见，再装。
      - name: 冒烟：从 registry 装回来再跑 --version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./npm/out/@anspire-ai/ontok-builder/package.json').version")
          ok=""
          for i in $(seq 1 12); do
            if npm view "@anspire-ai/ontok-builder@$ver" version >/dev/null 2>&1; then
              echo "registry 已可见 $ver（第 $i 次检查）"
              ok=1
              break
            fi
            echo "等待 registry 传播…（$i/12，每 15s）"
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::error::发布后约 3 分钟，registry 仍看不到 @anspire-ai/ontok-builder@$ver —— 若 publish 步确实成功，这是 CDN 延迟，稍后手动重跑本工作流即可"
            exit 1
          fi
          d=$(mktemp -d); cd "$d"
          npm init -y >/dev/null
          npm i "@anspire-ai/ontok-builder@$ver" --include=optional --prefer-online
          npx ontok-builder --version

  # 空跑时也把 4 个包打成一个 artifact：首次发布（手动、要输 OTP）只下一个 zip 就够。
  # 用法见 Deploy/tools/PUBLISH.md「第一次发布」。
  bundle:
    name: bundle npm packages
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 下载三个平台包
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm/out
          merge-multiple: true
      - name: 生成主包
        run: node npm/prepare.mjs main
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./npm/out/@anspire-ai/ontok-builder/package.json').version")
          cd npm/out
          zip -qr "../../npm-${ver}.zip" .
          cd ../..
          ls -lh "npm-${ver}.zip"
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-bundle
          path: npm-*.zip
          if-no-files-found: error
          retention-days: 30
