[package]
name = "ontok"
version = "0.1.0"
edition = "2021"
# MSRV —— 让 cargo 自动挑选兼容本机工具链的依赖版本，避免解析到要更高 rustc 的包
#
# 1.88 是**依赖给出的硬下限**，不是我们挑的：
#   home 0.5.12 / icu_collections 2.3 / icu_provider 2.3.1 等都声明 rustc >= 1.88。
# 之前写 1.86 与实际锁文件不符，导致镜像构建报
#   "rustc 1.86.0 is not supported by the following packages: home@0.5.12 requires rustc 1.88"
# 本机实测工具链 1.96.0；镜像里也用 1.96.0（与本地一致，保证同一份代码两边都能编）。
rust-version = "1.88"

[workspace]

[lib]
name = "ontok"
path = "src/lib.rs"

[[bin]]
name = "ontok"
path = "src/main.rs"

[dependencies]
# REQ-123：`time`（SSE 的 keep-alive / 空闲超时）是 MCP over HTTP 真用到的 tokio 模块。
# ⛔ 不新增 crate —— 只把「用了什么」写清楚（这个 feature 本来就被 sqlx / hyper 打开，
# 声明它不改变依赖图）。⛔ 也**不用** `tokio::sync`：SSE 的流用 `futures_util::stream::unfold`
# 直接表达（见 `src/query/http.rs` 的 `mcp_sse`），不需要 channel。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# REQ-034：内置 LLM 兜底 agent 要打 OpenAI 兼容端点，本 crate 此前**零 HTTP 客户端**。
#
# 为什么是 ureq 而不是 reqwest（本 crate 的纪律决定了答案，不是随手选的）：
# · **阻塞 I/O**：`ExtractionAgent` 的方法全是同步的（`mod.rs` 模块头：MSRV 1.86 下
#   没有 dyn-safe 的 `async fn in trait`，也没有 async-trait 依赖）。reqwest 是
#   async 的，要用它就得在同步方法里 `block_on` —— 而 `block_on` 在已有 runtime
#   上下文里**直接 panic**（ADR-002 · N3；`acp/mod.rs:38-41` 记着这个坑，
#   并为此专门选了「一个 block_on 都不写」的方案）。ureq 让本实现与那条纪律一致。
# · **依赖面小**：默认 rustls，**不碰 OpenSSL 系统库**，且 rustls 已经在树里
#   （sqlx 的 `runtime-tokio-rustls`），TLS 侧不引入第二套栈。
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }

# REQ-093 · 只读图服务用 axum：与 tokio 同栈、纯 Rust 不碰 OpenSSL、
# 且「只注册 GET ⇒ 错方法自动 405」把只读性落在**类型**上而不是靠人记。
# 详细选型理由见 `src/server/http.rs` 的模块头。
axum = { version = "0.7", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }

# ⭐ REQ-123 · SSE 的**流**：axum 的 `Sse` 要一个 `TryStream`，而本 crate 里**无法**
# 命名 `futures_core::Stream`（futures-core 不是直接依赖）⇒ 必须有一个能提供
# `stream::unfold` 的 crate。
#
# ⚠️ 如实登记（AC-011 写的是「不引新依赖」）：
# · `futures-util` **已经在依赖树里**（axum 直接依赖它，features = ["alloc"]），
#   这里用**同一个版本、同一组 feature**；`Cargo.lock` 只多一行「ontok → futures-util」，
#   **不新增任何 crate**（编译的包集合与依赖树不变）。
# · 落选方案：`tokio-stream`（`features=["sync"]` 的 `ReceiverStream`）—— 它会把
#   `tokio-util` 拉进依赖（`Cargo.lock` 真新增一个包），比这一行贵。
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
# 用外部测试库（PG 16.14），不引入 testcontainers
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
# axum 路由的进程内测试入口（`Router::oneshot`）。
# 只在测试里用，用来断言 405 / 401 / 守门器拒绝 —— 不必真起 socket。
tower = { version = "0.5", features = ["util"] }
